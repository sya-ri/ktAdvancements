// buildSrc inherits the root build cache. Only let build-logic compilation populate it:
// Minecraft tooling and runtime outputs must remain on the ephemeral runner.
gradle.beforeProject { project ->
    project.tasks.configureEach { task ->
        // Execute tests on every fresh runner even when compiled test classes are cached.
        if (project.rootProject.name != 'buildSrc' || task instanceof org.gradle.api.tasks.testing.Test) {
            outputs.doNotCacheIf('CI shares buildSrc compilation outputs only') { true }
        }
    }
}
